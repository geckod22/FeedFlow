[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedflow"
version = "2.0.0"
description = "Stdio MCP server to manage feeds"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=2.14.2",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-local-badge>=1.0.3",
    "pytest-mock>=3.15.1",
    "respx>=0.22.0",
]

[project.scripts]
feedflow = "feedflow.main:main"